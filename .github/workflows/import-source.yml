name: Import tested TastePilot source

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tastepilot-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and check out the tested source
        shell: bash
        run: |
          set -euo pipefail
          git bundle verify tastepilot-source.bundle
          git fetch tastepilot-source.bundle main:refs/remotes/imported/main
          test "$(git rev-parse refs/remotes/imported/main)" = "5281b9b2842ef9ed64ed8bd2516c51747c828bb1"
          git checkout --detach refs/remotes/imported/main
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate source and production build
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm check:secrets
      - name: Merge source and remove source bundle
        shell: bash
        run: |
          set -euo pipefail
          git switch main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit refs/remotes/imported/main
          git rm -- tastepilot-source.bundle
          git commit -m "Remove completed one-time source import"
          git diff --exit-code refs/remotes/imported/main HEAD -- . ':!.github/workflows/import-source.yml'
          git push origin HEAD:main
